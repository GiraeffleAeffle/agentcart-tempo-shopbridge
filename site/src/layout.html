<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="AgentCart home">AgentCart</a>
      <nav aria-label="Main navigation">$navigation</nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
$content
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <nav aria-label="Footer navigation">
        <a href="/legal/">Legal notice</a>
        <a href="/privacy/">Privacy</a>
        <a href="https://github.com/GiraeffleAeffle/agentcart-tempo-shopbridge">GitHub repository</a>
      </nav>
      <p>Current release: <a href="$release_url" data-release-version="$version">$version</a> · Testnet and sandbox only.</p>
    </div>
  </footer>
</body>
</html>
