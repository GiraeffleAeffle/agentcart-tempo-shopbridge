worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No request logs: visitor addresses are never written (see /privacy/).
  access_log off;
  sendfile on;
  server_tokens off;
  # Relative Location headers: directory redirects must not expose the container port.
  absolute_redirect off;
  charset utf-8;
  gzip on;
  gzip_types text/css text/plain application/xml image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Probes and unknown hosts.
  server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
  }

  server {
    listen 8080;
    server_name agentcart.eu;
    include /etc/nginx/agentcart-site/security-headers.conf;
    include /etc/nginx/agentcart-site/site.conf;
  }

  # Pre-launch preview under the existing *.staging.agentcart.eu record; never indexed.
  server {
    listen 8080;
    server_name preview.staging.agentcart.eu;
    include /etc/nginx/agentcart-site/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/agentcart-site/site.conf;
  }

  server {
    listen 8080;
    server_name www.agentcart.eu;
    include /etc/nginx/agentcart-site/security-headers.conf;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://agentcart.eu$request_uri; }
  }
}
