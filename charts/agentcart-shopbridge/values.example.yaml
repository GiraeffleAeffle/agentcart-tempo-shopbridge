# Copy this file to values.private.yaml before editing it. The private filename
# is ignored by Git; never place credentials in Helm values.
existingSecret: example-shopbridge-secrets

store:
  host: shop.example.test
  title: Example AgentCart Shop
  merchantId: example-shop
  environmentType: staging
  marketProfile: eur
  varianceProfile: baseline-eu-tax-shipping
  tempoNetwork: testnet
  tempoRecipientAddress: "0x0000000000000000000000000000000000000000"
  # Set all four only after a testnet registry contract exists and the stable
  # record id has been computed for this domain/controller pair.
  registryOnchain:
    controller: ""
    chainId: ""
    registryAddress: ""
    recordId: ""
  checkoutMode: trusted_token_or_verifier
  signedRequestMode: "off"
  productExposureMode: manual
  returnsPath: /returns

# Enable only after publishing a pinned verifier image and adding
# AGENTCART_PAYMENT_VERIFIER_TOKEN plus AGENTCART_TEMPO_REFUND_PRIVATE_KEY to
# the external Secret. Tempo refundMode=live requires the refund key.
verifier:
  enabled: false
  # When enabled, add AGENTCART_VERIFIER_ALERT_WEBHOOK_URL and optionally
  # AGENTCART_VERIFIER_ALERT_WEBHOOK_TOKEN to existingSecret.
  alerts:
    enabled: false
    minSeverity: warning
    throttleSeconds: 300

database:
  persistence:
    storageClass: standard
    size: 10Gi

persistence:
  uploads:
    storageClass: standard
    size: 10Gi

ingress:
  className: haproxy
  tlsSecretName: example-shopbridge-tls

certificate:
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

networkPolicy:
  # Add only source CIDRs emitted by your ingress controller when its namespace
  # selector is insufficient. Keep real cluster CIDRs in values.private.yaml.
  ingressSourceCidrs: []
