apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentcart-shopbridge.dbFullname" . }}
  labels:
    {{- include "agentcart-shopbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "agentcart-shopbridge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentcart-shopbridge.dbFullname" . }}
  labels:
    {{- include "agentcart-shopbridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "agentcart-shopbridge.dbFullname" . }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "agentcart-shopbridge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "agentcart-shopbridge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: agentcart
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ include "agentcart-shopbridge.image" .Values.images.mariadb }}
          imagePullPolicy: {{ .Values.images.mariadb.pullPolicy }}
          env:
            - {name: MARIADB_DATABASE, value: {{ .Values.database.name | quote }}}
            - {name: MARIADB_USER, value: {{ .Values.database.user | quote }}}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WORDPRESS_DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: MARIADB_ROOT_PASSWORD
          ports:
            - {name: mysql, containerPort: 3306}
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: run, mountPath: /run/mysqld}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "agentcart-shopbridge.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: agentcart
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
