worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.php index.html;
        client_max_body_size 16m;

        location = /xmlrpc.php { return 404; }
        location ~* /(?:uploads|files)/.*\.php$ { return 404; }
        location = /.well-known/agentcart.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-proof.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-revocations.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-bundle.json { try_files $uri /index.php?$args; }
        location ~ "^/\.well-known/agentcart-registry-records/[0-9a-f]{64}\.json$" { try_files $uri /index.php?$args; }
        location ~ /\. { deny all; }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_read_timeout 60s;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
