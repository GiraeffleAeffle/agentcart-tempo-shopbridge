worker_processes auto;
# Error lines always include the client address and full request line, query string included;
# failed requests remain visible as 4xx/5xx in the path-only access log.
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No client address, user agent, referrer or query string: query strings can carry order status tokens.
    # The original request path is logged; $uri would already be /index.php after try_files.
    map $request_uri $agentcart_log_path {
        ~^([^?]*) $1;
    }
    log_format agentcart_minimal '$time_iso8601 "$request_method $agentcart_log_path $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout agentcart_minimal;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.php index.html;
        client_max_body_size 16m;

        location = /xmlrpc.php { return 404; }
        location ~* /(?:uploads|files)/.*\.php$ { return 404; }
        location = /.well-known/agentcart.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-proof.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-revocations.json { try_files $uri /index.php?$args; }
        location = /.well-known/agentcart-registry-bundle.json { try_files $uri /index.php?$args; }
        location ~ "^/\.well-known/agentcart-registry-records/[0-9a-f]{64}\.json$" { try_files $uri /index.php?$args; }
        location ~ /\. { deny all; }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_read_timeout 60s;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
