nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: docker.io/library/nginx
  digest: sha256:3bcf852aed06467cf075c6105892e4d5a6ebbbafa0ce22d35062db9e90ddef4c
  pullPolicy: IfNotPresent

registry:
  host: registry.example.test
  tlsSecretName: registry-tls
  name: AgentCart ShopBridge Merchant Registry
  stage: pilot
  updatedAt: "1970-01-01T00:00:00Z"
  submissionMode: maintainer_curated
  entries: []
  onchain:
    ethereumMainnet:
      status: not_deployed
      chainId: "1"
      contractAddress: ""
      explorerUrl: ""
    tempo:
      status: not_deployed
      chainId: ""
      contractAddress: ""
      explorerUrl: ""
  onchainEvents:
    enabled: false
    source: static
    document: {}
    rpcIndexer:
      deployment: tempo
      rpcUrl: ""
      fromBlock: "0"
      chunkSize: 10000
      refreshSeconds: 240
      image:
        repository: ghcr.io/giraeffleaeffle/agentcart-shopbridge-verifier
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 500m
          memory: 256Mi
  # Immutable content-addressed documents referenced by contract recordURI
  # values. Historical entries stay published for finalized event replay.
  onchainRecords: []

service:
  port: 80

ingress:
  enabled: true
  className: haproxy
  annotations: {}

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-system
  ingressSourceCidrs: []
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  externalHttpsExceptCidrs:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.18.0.0/15
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 240.0.0.0/4
  externalHttpsExceptCidrsV6:
    - ::/128
    - ::1/128
    - ::ffff:0:0/96
    - 64:ff9b::/96
    - 100::/64
    - 2001:db8::/32
    - fc00::/7
    - fe80::/10
    - fec0::/10
    - ff00::/8

podLabels:
  agentcart.eu/data-classification: public-pilot-registry

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 100m
    memory: 64Mi
