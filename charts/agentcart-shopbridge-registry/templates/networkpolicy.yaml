{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentcart-shopbridge-registry.fullname" . }}
  labels:
    {{- include "agentcart-shopbridge-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentcart-shopbridge-registry.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
        {{- range .Values.networkPolicy.ingressSourceCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
{{- if and .Values.registry.onchainEvents.enabled (eq .Values.registry.onchainEvents.source "rpc_indexer") }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.externalHttpsExceptCidrs | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              {{- toYaml .Values.networkPolicy.externalHttpsExceptCidrsV6 | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
{{- else }}
    []
{{- end }}
{{- end }}
